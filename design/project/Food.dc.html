<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food diary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1E73BE;text-decoration:none}a:hover{color:#165A96}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEFF4; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">
  <div style="padding: 20px 16px 100px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.5px">Food</h1>
      <div style="display: flex; align-items: center; gap: 2px; height: 32px; border-radius: 16px; background: #FFFFFF">
        <button type="button" aria-label="Previous day" style="width: 32px; height: 32px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E73BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <span style="font-size: 15px; font-weight: 600">Today</span>
        <button type="button" aria-label="Next day" style="width: 32px; height: 32px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #FFFFFF">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.4px">1,610<span style="font-size: 15px; font-weight: 500; color: #6D6D72"> / 2,850 kcal</span></div>
        <div style="font-size: 14px; font-weight: 600; color: #1E73BE">1,240 left</div>
      </div>
      <div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #EDEDF2">
        <div style="width: 16.6%; background: #1E73BE"></div>
        <div style="width: 22.5%; background: #E8890C"></div>
        <div style="width: 16.4%; background: #8E5BD8"></div>
      </div>
      <div style="display: flex; gap: 16px; font-size: 13px; color: #3C3C43">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1E73BE"></span>Protein 118 g</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #E8890C"></span>Carbs 160 g</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8E5BD8"></span>Fat 52 g</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: #E3E3E8">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D6D72" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search food</span>
        <input type="search" placeholder="Search food" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: #111111"/>
      </label>
      <button type="button" aria-label="Scan barcode" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #1E73BE; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
      </button>
    </div>

    <sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; overflow: hidden">
        <button type="button" onClick="{{m.toggle}}" aria-expanded="{{m.open}}" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border: 0; background: transparent; font: inherit; color: #111111; text-align: left; cursor: pointer">
          <span style="width: 30px; height: 30px; border-radius: 8px; background: {{m.color}}; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2.5-3 6s1.5 4 3 4v8"/></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 16px; font-weight: 600">{{m.name}}</span>
            <span style="font-size: 13px; color: #6D6D72">{{m.sub}}</span>
          </span>
          <span style="font-size: 16px; font-weight: 600">{{m.kcal}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0B0B6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{m.rot}}"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <sc-if value="{{m.open}}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{m.items}}" as="it" hint-placeholder-count="3">
            <div style="height: 0.5px; margin-left: 58px; background: #E0E0E5"></div>
            <div style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px 0 58px">
              <span style="flex: 1; display: flex; flex-direction: column">
                <span style="font-size: 15px">{{it.name}}</span>
                <span style="font-size: 13px; color: #6D6D72">{{it.qty}}</span>
              </span>
              <span style="font-size: 15px; color: #3C3C43">{{it.kcal}}</span>
            </div>
          </sc-for>
          <div style="height: 0.5px; margin-left: 58px; background: #E0E0E5"></div>
          <div style="display: flex; align-items: center; gap: 16px; height: 46px; padding: 0 16px 0 58px">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #1E73BE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E73BE" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add food</span>
            <span style="font-size: 15px; color: #1E73BE">Quick add</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: rgba(249, 249, 251, 0.96); border-top: 0.5px solid #C8C8CE">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: #6D6D72; font-size: 10px; font-weight: 500">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6D6D72" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
    <a href="Routines.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: #6D6D72; font-size: 10px; font-weight: 500">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6D6D72" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</a>
    <a href="Food.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: #1E73BE; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E73BE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2.5-3 6s1.5 4 3 4v8"/></svg>Food</a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: #6D6D72; font-size: 10px; font-weight: 500">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6D6D72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>Progress</a>
    <a href="Body.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: #6D6D72; font-size: 10px; font-weight: 500">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6D6D72" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Body</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'lunch' };
  }
  renderVals() {
    const data = [
      { id: 'breakfast', name: 'Breakfast', color: '#E8890C', kcal: '620', items: [
        { name: 'Oatmeal', qty: '80 g', kcal: '300' },
        { name: 'Whey protein', qty: '1 scoop · 30 g', kcal: '120' },
        { name: 'Banana', qty: '1 medium', kcal: '105' },
        { name: 'Peanut butter', qty: '15 g', kcal: '95' }
      ] },
      { id: 'lunch', name: 'Lunch', color: '#23843F', kcal: '740', items: [
        { name: 'Chicken breast, grilled', qty: '200 g', kcal: '330' },
        { name: 'White rice, cooked', qty: '200 g', kcal: '260' },
        { name: 'Olive oil', qty: '10 ml', kcal: '90' },
        { name: 'Mixed salad', qty: '1 bowl', kcal: '60' }
      ] },
      { id: 'snack', name: 'Snack', color: '#8E5BD8', kcal: '250', items: [
        { name: 'Greek yogurt 0%', qty: '170 g', kcal: '100' },
        { name: 'Almonds', qty: '25 g', kcal: '150' }
      ] },
      { id: 'dinner', name: 'Dinner', color: '#1E73BE', kcal: '—', items: [] }
    ];
    const meals = data.map((m) => {
      const open = this.state.open === m.id;
      return {
        ...m,
        open,
        rot: open ? 'rotate(90deg)' : 'none',
        sub: m.items.length ? m.items.length + ' items' : 'Nothing logged yet',
        toggle: () => this.setState({ open: open ? null : m.id })
      };
    });
    return { meals };
  }
}
</script>
</body>
</html>
